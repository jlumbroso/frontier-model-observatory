name: Verify

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository and LFS objects
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Install system dependencies
        run: just install-ci-system-dependencies

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run complete verification
        run: just verify-complete

      - name: Ensure failures remain legible
        if: always()
        shell: bash
        run: |
          if [[ ! -f build/verification-summary.md ]]; then
            {
              echo "# Frontier Model Observatory verification"
              echo
              echo "## Verification did not reach the summary renderer"
              echo
              echo "- Revision: \`${GITHUB_SHA}\`"
              echo "- Event: \`${GITHUB_EVENT_NAME}\`"
              echo "- Actor: \`${GITHUB_ACTOR}\`"
              echo "- Inspect the failed setup or dependency step above."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ github.sha }}
          path: |
            build/verification.json
            build/verification-summary.md
          if-no-files-found: warn
          retention-days: 30
