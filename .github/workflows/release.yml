name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version matching the skill version"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish release assets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository and LFS objects
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Resolve release version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$DISPATCH_VERSION"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Run complete verification
        run: just verify-complete

      - name: Build deterministic release assets
        run: just package-release "${{ steps.version.outputs.version }}"

      - name: Append release assets to summary
        shell: bash
        run: |
          {
            echo
            echo "## Release assets"
            echo
            echo "| SHA-256 | File |"
            echo "|---|---|"
            while read -r digest file; do
              echo "| \`$digest\` | \`$file\` |"
            done < build/release/SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure release result remains legible
        if: always()
        shell: bash
        run: |
          {
            echo
            echo "## Release pipeline"
            echo
            if [[ -f build/release/release-manifest.json ]]; then
              echo "- Release bundle: **produced**"
              echo "- Integrity manifest: \`build/release/release-manifest.json\`"
            else
              echo "- Release bundle: **not produced**"
              echo "- Inspect the first failed step after verification."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ ! -f build/verification-summary.md ]]; then
            {
              echo "# Frontier Model Observatory release"
              echo
              echo "The run did not reach the verification summary renderer."
              echo "Inspect the failed setup or dependency step above."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload complete release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontier-model-observatory-${{ steps.version.outputs.version }}
          path: build/release/
          if-no-files-found: error
          retention-days: 90

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" build/release/* --clobber
